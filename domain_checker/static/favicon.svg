<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="域名批量查询系统">
  <title>域名批量查询系统</title>
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bgDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <radialGradient id="globeFill" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </radialGradient>
  </defs>
  <style>
    .bg-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .bg-light { display: none; }
      .bg-dark { display: inline; }
    }
  </style>

  <rect class="bg-light" x="4" y="4" width="120" height="120" rx="26" fill="url(#bgLight)"/>
  <rect class="bg-dark" x="4" y="4" width="120" height="120" rx="26" fill="url(#bgDark)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <circle cx="56" cy="60" r="30" fill="url(#globeFill)"/>
  <ellipse cx="56" cy="60" rx="30" ry="11" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <ellipse cx="56" cy="60" rx="11" ry="30" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="26" y1="60" x2="86" y2="60" stroke="#60a5fa" stroke-width="2.5"/>
  <line x1="56" y1="30" x2="56" y2="90" stroke="#60a5fa" stroke-width="2.5"/>

  <circle cx="90" cy="90" r="21" fill="#22c55e"/>
  <circle cx="90" cy="90" r="21" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M81.5 90 l6.5 6.5 l14 -15" fill="none" stroke="#ffffff" stroke-width="5.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>