server {
    listen 80;
    listen [::]:80;
    server_name checker.example.com;

    access_log /var/log/nginx/domain-checker.access.log;
    error_log /var/log/nginx/domain-checker.error.log;

    client_max_body_size 2m;

    location / {
        # 应用没有用户登录系统，公网部署建议保留 Nginx Basic Auth。
        auth_basic "Domain Checker";
        auth_basic_user_file /etc/nginx/.htpasswd-domain-checker;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
